[package]
name = "cycle-finance-breakout-system"
version = "0.1.0"
edition = "2021"
default-run = "cycle-finance-breakout-system"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ratatui = "0.24"
crossterm = "0.27"
dashmap = "5.5"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
async-trait = "0.1"
libloading = "0.8"
serde_json = "1.0"
sysinfo = "0.30"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.24.1", features = ["v4"] }
core_affinity = "0.8.3"
crossbeam = "0.8.4"
flow_engine = { path = "../flow_engine" }
interactive_shell = { path = "../../apps/interactive_shell" }
tui-textarea = "0.4.0"
rustyline = "12.0"
