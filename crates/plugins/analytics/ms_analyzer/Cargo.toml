[package]
name = "plugin_ms_analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rust_decimal = { version = "1.42.1", features = ["serde", "maths"] }
ohlcv-engine = { path = "ohlcv-engine" }

[lib]
name = "plugin_ms_analyzer"
crate-type = ["cdylib", "rlib"]
